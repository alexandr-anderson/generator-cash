name: Deploy to Timeweb

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-timeweb
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_PATH: /home/c/cm149295/postvmeste
      PUBLIC_HTML: /home/c/cm149295/postvmeste/public_html
      APP_NAME: postvmeste
      APP_PORT: "3001"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build standalone app
        run: NODE_ENV=production npm run build

      - name: Package release
        run: bash scripts/package-standalone.sh

      - name: Configure SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT}" "${SSH_HOST}" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o RequestTTY=no \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${DEPLOY_PATH}' '${PUBLIC_HTML}'"
          rsync -az --delete --exclude-from=scripts/rsync-excludes.txt \
            -e "ssh -i ~/.ssh/deploy_key -p ${SSH_PORT} -o BatchMode=yes -o ConnectTimeout=20" \
            release/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/"

      - name: Sync OpenAI env on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          OPENAI_IMAGE_API_KEY: ${{ secrets.OPENAI_IMAGE_API_KEY }}
          OPENAI_IMAGE_BASE_URL: ${{ secrets.OPENAI_IMAGE_BASE_URL }}
          OPENAI_IMAGE_MODEL: ${{ secrets.OPENAI_IMAGE_MODEL }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          if [ -z "${OPENAI_API_KEY}" ] && [ -z "${OPENAI_IMAGE_API_KEY}" ]; then
            echo "OpenAI secrets not set, skipping"
            exit 0
          fi
          umask 077
          : > openai-incoming
          if [ -n "${OPENAI_API_KEY}" ]; then
            {
              printf 'OPENAI_BASE_URL=%s\n' "${OPENAI_BASE_URL:-https://codex-free.com/v1}"
              printf 'OPENAI_API_KEY=%s\n' "${OPENAI_API_KEY}"
              printf 'OPENAI_MODEL=%s\n' "${OPENAI_MODEL:-gpt-5.5}"
            } >> openai-incoming
          fi
          if [ -n "${OPENAI_IMAGE_API_KEY}" ]; then
            {
              printf 'OPENAI_IMAGE_BASE_URL=%s\n' "${OPENAI_IMAGE_BASE_URL}"
              printf 'OPENAI_IMAGE_API_KEY=%s\n' "${OPENAI_IMAGE_API_KEY}"
              printf 'OPENAI_IMAGE_MODEL=%s\n' "${OPENAI_IMAGE_MODEL:-gpt-image-2}"
            } >> openai-incoming
          fi
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT}" -o BatchMode=yes -o ConnectTimeout=20 \
            openai-incoming "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}/.openai-incoming"
          rm -f openai-incoming
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o RequestTTY=no \
            "${SSH_USER}@${SSH_HOST}" \
            "bash --noprofile --norc -c 'php ${DEPLOY_PATH}/scripts/upsert-env-keys.php ${DEPLOY_PATH}/.env ${DEPLOY_PATH}/.openai-incoming && rm -f ${DEPLOY_PATH}/.openai-incoming'"

      - name: Restart app on server
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          SSH_PORT="${SSH_PORT:-22}"
          timeout 120 ssh -i ~/.ssh/deploy_key -p "${SSH_PORT}" -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o RequestTTY=no \
            "${SSH_USER}@${SSH_HOST}" \
            "export DEPLOY_PATH='${DEPLOY_PATH}' PUBLIC_HTML='${PUBLIC_HTML}' APP_NAME='${APP_NAME}' APP_PORT='${APP_PORT}' NODE_ENV='production' NPM_CI_ARGS='--ignore-scripts' && cd '${DEPLOY_PATH}' && if command -v timeout >/dev/null; then timeout 90 bash scripts/restart-app.sh; else bash scripts/restart-app.sh; fi"
