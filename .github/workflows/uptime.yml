name: Uptime

on:
  schedule:
    # GitHub deprioritises high-frequency schedules: "*/5" was firing roughly
    # every 2-5 hours, never every 5 minutes. Asking for less makes it likelier
    # the run actually happens. Actions cannot do minute-level monitoring — an
    # external uptime service is the only way to get that.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test Telegram message
        type: boolean
        default: true

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # Caches are immutable: a fixed key is written once and every later run
      # only restores it, so the state froze on the day it was first saved and
      # the down alert could never fire. The run id makes each save a new entry;
      # restore-keys picks up the most recent one.
      - name: Restore uptime state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .uptime-state.json
          key: postvmeste-uptime-v2-${{ github.run_id }}
          restore-keys: |
            postvmeste-uptime-v2-

      - name: Check health and alert Telegram
        env:
          HEALTH_URL: https://postvmeste.ru/api/health
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          UPTIME_STATE_FILE: .uptime-state.json
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_alert != 'false' && '1' || '' }}
        run: node scripts/uptime-check.js
