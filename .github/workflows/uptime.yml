name: Uptime

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Send a test Telegram message
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Restore uptime state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .uptime-state.json
          key: postvmeste-uptime-v1

      - name: Check health and alert Telegram
        env:
          HEALTH_URL: https://postvmeste.ru/api/health
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHAT: ${{ vars.TELEGRAM_CHAT }}
          UPTIME_STATE_FILE: .uptime-state.json
          TELEGRAM_TEST: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.test_alert != 'false' && '1' || '' }}
        run: node scripts/uptime-check.js
